; FakeSolar: Faketec (ProMicro nRF52840) + E22-400M22S (SX1268) + AHT20/BMP280 + INA3221 + PCF8563 + GPS
; Board sources are shared with variants/promicro.

[Faketec_SX1268]
extends = Promicro
build_flags = ${nrf52_base.build_flags}
  -I variants/promicro
  -D PROMICRO
  -D USE_SX1268
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_FREQ=433.650
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5
  -D GPS_BAUD_AUTODETECT
  -D GPS_DUTY_CYCLE
  -D GPS_CYCLE_MIN=30
  -D GPS_ONTIME_SEC=300
  -D GPS_GUARD
  -D GPS_GUARD_LAT_MIN=44.0
  -D GPS_GUARD_LAT_MAX=52.5
  -D GPS_GUARD_LON_MIN=22.0
  -D GPS_GUARD_LON_MAX=40.3
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D TELEM_INA3221_ADDRESS=0x42
  -D TELEM_INA3221_SHUNT_CH1=0.1f
  -D TELEM_INA3221_SHUNT_CH2=0.04f
  -D TELEM_INA3221_SHUNT_CH3=0.04f
  -D TELEM_INA3221_BAT_CH=2
  -D ADC_MULTIPLIER=1.5234f
  -D BATT_ADC_SAMPLE_TIME_US=40

[env:Faketec_SX1268_repeater]
extends = Faketec_SX1268
build_src_filter = ${Promicro.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags = ${Faketec_SX1268.build_flags}
  -D ADVERT_NAME='"Faketec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Faketec_SX1268_sensor]
extends = Faketec_SX1268
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_sensor>
build_flags = ${Faketec_SX1268.build_flags}
  -D ADVERT_NAME='"Faketec Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D DISPLAY_CLASS=SSD1306Display
lib_deps = ${Promicro.lib_deps}

[env:Faketec_SX1268_companion_radio_ble]
extends = Faketec_SX1268
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Faketec_SX1268.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

[env:Faketec_SX1268_repeater_debug]
extends = env:Faketec_SX1268_repeater
build_flags = ${env:Faketec_SX1268_repeater.build_flags}
  -D MESH_DEBUG=1
